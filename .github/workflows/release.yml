name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: flowcontrol-win-x64.exe
          - rid: osx-x64
            asset: flowcontrol-osx-x64
          - rid: osx-arm64
            asset: flowcontrol-osx-arm64
          - rid: linux-x64
            asset: flowcontrol-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            --output publish/${{ matrix.rid }}

      - name: Rename binary
        run: |
          src=$(find publish/${{ matrix.rid }} -maxdepth 1 -type f ! -name "*.pdb" | head -1)
          mv "$src" publish/${{ matrix.rid }}/${{ matrix.asset }}
          chmod +x publish/${{ matrix.rid }}/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: publish/${{ matrix.rid }}/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
